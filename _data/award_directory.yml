# Titles come from the existing authoritative award pages, not copies here.
- url: /programs/awards/outstanding.html
  nomination: /programs/awards/outstanding-and-distinguished-nomination.html
  recipients: true
  description: "The [ACM SIGCSE Award for Outstanding Contribution to Computer Science Education](outstanding.html) honors an individual or group in recognition of a significant contribution to computer science education. The contribution may take many forms, such as: curriculum design, innovative teaching methods, textbook authorship, development of new teaching tools, or any of a number of other significant contributions to computer science education. The contribution should have had long lasting impact on, and made a significant difference in, computing education. This award was initiated in 1981."
- url: /programs/awards/distinguished.html
  nomination: /programs/awards/outstanding-and-distinguished-nomination.html
  recipients: true
  description: "The [ACM SIGCSE Award for Distinguished Service to the Computer Science Education Community](distinguished.html) honors an individual who has a long history of volunteer service to the computer science education community. This service, which is not limited to service to SIGCSE, may take many forms, such as professional society leadership, conference organization, outreach efforts, editorial board participation, or any of a number of other types of service to the computer science education community. Awards may recognize service at any level, for example: K-12, college, graduate, or continuing post-college. This award was initiated in 1997."
- url: /programs/awards/broadening.html
  nomination: /programs/awards/broadening-nomination.html
  recipients: true
  description: "The [ACM SIGCSE Award for Broadening Participation in Computing Education](broadening.html) recognizes an early career SIGCSE Member that has made a fundamental and innovative contribution to broadening participation in computing education. The contribution may take many forms, such as: curriculum design, outreach to underserved communities, creation of programs, policies or initiatives that increase representation in computing, publishing work that helps the community understand underrepresentation issues, or any of a number of other significant contributions toward broadening participation in computing education. In addition, contributions can span any sector in computing education, including primary or secondary education (e.g., in the US this includes, K-12, community college, four year institutions), or even community-based educational organizations. Similarly, the award is open to individuals that work in education or industry, as long as their contribution has had an impact in broadening participation in computing education. This award was initiated in 2024."
- url: /programs/awards/test-of-time.html
  nomination: /programs/awards/test-of-time-nomination.html
  recipients: true
  description: "The [ACM SIGCSE Test of Time Award](test-of-time.html) recognizes an outstanding paper published in the SIGCSE community that has had a meaningful impact on computing education practice and research. Significant impact can be demonstrated through citations, adoptions and/or adaptations of techniques and practices described in the paper by others, techniques described in the paper that have become widely recognized as best practices, or other evidence the paper is a seminal work in the domain of computing education. The paper must have been published in a conference sponsored or co-sponsored by SIGCSE or in an ACM journal at least 10 years prior (i.e., for the 2024 award, papers must have been published before Dec 31, 2013). This award was initiated in 2019, with the first award presented in 2020."
- url: /programs/awards/early-career.html
  nomination: /programs/awards/early-career-nomination.html
  recipients: false
  description: "The [ACM SIGCSE Early Career Researcher Award](early-career.html) recognizes and encourages outstanding contributions to computing education research by individuals in the early stages of their academic careers. This award is designed to highlight innovative and impactful work that addresses critical challenges in computing education, fosters pedagogical advancements, or provides new theoretical and empirical insights into the field. It aims to celebrate and support emerging researchers whose work demonstrates exceptional promise and aligns with ACM's mission to advance computing as a science and profession.\nThis award was initiated in 2025."
