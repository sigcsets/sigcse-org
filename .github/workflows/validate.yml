name: Build and validate
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mode: [live, staging, github-pages]
    env:
      BUNDLE_FROZEN: "true"
      JEKYLL_ENV: production
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1
        with:
          bundler: "2.4.20"
          bundler-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install locked search and browser tools
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Validate source and regression checks
        run: |
          bundle exec ruby scripts/validate_source.rb
          bundle exec ruby tests/check_site_logic.rb
          bundle exec ruby tests/check_maintainer_schema.rb
          bundle exec ruby scripts/check_freshness.rb
          python -m unittest discover -s tests -v
      - name: Build clean output
        run: bundle exec ruby scripts/build.rb ${{ matrix.mode }}
      - name: Validate live URLs, links, redirects and accessibility smoke checks
        if: matrix.mode == 'live'
        run: |
          python scripts/site.py validate
          python scripts/check_tasks.py
          python scripts/check_design.py
      - name: Validate staging prefix and preserved URLs
        if: matrix.mode == 'staging'
        run: python scripts/site.py validate --baseurl /.staging
      - name: Validate GitHub Pages prefix and publication policy
        if: matrix.mode == 'github-pages'
        run: |
          python scripts/site.py validate --baseurl /sigcse-org
          python scripts/check_pages.py
      - name: Package validated live preview
        if: matrix.mode == 'live'
        run: python scripts/site.py package
      - name: Test real search, public index, keyboard, reflow and accessibility
        env:
          SEARCH_BASEURL: ${{ matrix.mode == 'staging' && '/.staging' || matrix.mode == 'github-pages' && '/sigcse-org' || '' }}
        run: |
          python scripts/preview.py --baseurl "$SEARCH_BASEURL" > artifacts/search-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/search-browser.mjs
      - name: Exercise disposable release activation and rollback
        if: matrix.mode == 'live'
        run: python scripts/release_demo.py artifacts/site.tar.gz
      - name: Upload preview and validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-${{ matrix.mode }}-${{ github.run_id }}
          path: |
            artifacts/pages-policy.json
            artifacts/validation.json
            artifacts/task-paths.json
            artifacts/design-checks.json
            artifacts/freshness.json
            artifacts/search*/
            artifacts/site.tar.gz
            artifacts/site.tar.gz.sha256
            artifacts/site.tar.manifest.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validated Pages output
        if: matrix.mode == 'github-pages' && github.repository == 'sigcsets/sigcse-org' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 7
  deploy-pages:
    needs: validate
    if: github.repository == 'sigcsets/sigcse-org' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-preview
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  hosted-smoke:
    needs: deploy-pages
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install locked browser tools
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Test actual hosted search and pages
        env:
          SEARCH_ORIGIN: https://sigcsets.github.io
          SEARCH_BASEURL: /sigcse-org
          SEARCH_HOSTED: "true"
        run: |
          node tests/search-browser.mjs
          node tests/pages-hosted.mjs
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-smoke-${{ github.run_id }}
          path: |
            artifacts/hosted/
            artifacts/search*/
          retention-days: 7
