---
layout: default
---
<h1>{{ page.title }}</h1>
<div class="row">
{% for banner in site.data.banners %}<div class="col-md-4"><img class="img-fluid" src="{{ banner.image | relative_url }}" alt="{{ banner.imagealt }}"><h2>{{ banner.title }}</h2><p>{{ banner.byline }} <a href="{{ banner.url }}">Read more</a></p></div>{% endfor %}
</div>
{{ content }}
