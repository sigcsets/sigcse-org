{% if page.section.links %}<nav class="section-nav" aria-label="{{ page.section.name }} section"><h2>{{ page.section.name }}</h2>{% for item in page.section.links %}{% assign current = page.url | replace: 'index.html', '' %}{% assign target = item.link | replace: 'index.html', '' %}<a href="{{ item.link | relative_url }}"{% if current == target %} aria-current="page"{% elsif current contains target %} aria-current="location"{% endif %}>{{ item.name }}</a>{% endfor %}</nav>{% endif %}
