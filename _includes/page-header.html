<header class="site-header">
<div class="brand-row">
<a class="brand" href="{{ '/' | relative_url }}" aria-label="ACM SIGCSE home"><img src="{{ '/assets/images/logo/SIGCSE-logo_horiz_color_no-back.png' | relative_url }}" alt="ACM SIGCSE" width="230" height="64"></a>
<div class="utility"><a href="{{ '/about/profile.html' | relative_url }}">About SIGCSE</a><a href="{{ '/news/' | relative_url }}">News</a><a class="button small" href="{{ '/membership/join.html' | relative_url }}">Join SIGCSE <span aria-hidden="true">↗</span></a></div>
</div>
<details class="main-menu" open>
<summary>Explore SIGCSE <span aria-hidden="true">☰</span></summary>
<nav aria-label="Main navigation"><ul>{% for item in site.data.navigation %}<li><a href="{{ item.link | relative_url }}"{% if page.url contains item.link %} aria-current="page"{% endif %}>{{ item.name }}</a></li>{% endfor %}</ul></nav>
</details>
{% if site.staging %}<p class="preview-label">Staging preview</p>{% endif %}
</header>
